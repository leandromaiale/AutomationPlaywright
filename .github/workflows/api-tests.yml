name: API Tests

on:
  push:
    paths:
      - "api/**"
      - "tests/api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "tests/api/**"

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test tests/api --reporter=line,allure-playwright --output=allure-results/api

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          npx allure generate allure-results/api -o allure-report/api --clean

      - name: Deploy API Allure report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report/api
          destination_dir: api
          