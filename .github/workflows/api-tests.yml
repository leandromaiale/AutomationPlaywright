name: API Tests

on:
  push:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: |
          npx playwright test --project=api

      - name: Generate Allure API report
        run: |
          npx allure generate allure-results -o allure-report/api --clean

      - name: Publish API report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: api
          publish_dir: allure-report/api