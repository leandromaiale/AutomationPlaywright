name: UI Tests + Publish Allure Reports

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ---------------- UI TESTS ----------------
      - name: Run UI tests
        run: |
         export ALLURE_RESULTS_DIR=allure-results/ui 
         npx playwright test --project=ui

      - name: Generate UI Allure report
        run: |
          npx allure generate allure-results/ui -o allure-report/ui --clean

      # ---------------- DEPLOY ----------------
      - name: Publish UI report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: ui
          publish_dir: allure-report/ui
