name: UI Tests + Publish Allure Reports

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ---------------- UI TESTS ----------------
      - name: Run UI tests
        run: npx playwright test 

      - name: Generate UI Allure report
        run: |
          npx allure generate allure-results/ui -o allure-report/ui --clean

      # ---------------- LANDING PAGE ----------------
      - name: Create landing page
        run: |
          cat <<EOF > allure-report/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="UTF-8" />
              <title>Automation Test Reports</title>
            </head>
            <body>
              <h1>Automation Test Reports</h1>
              <ul>
                <li><a href="./ui/">UI Test Report</a></li>
                <li><a href="./api/">API Test Report</a></li>
              </ul>
            </body>
          </html>
          EOF

      # ---------------- DEPLOY ----------------
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true
