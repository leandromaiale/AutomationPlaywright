name: UI Tests

on:
  pull_request:
    paths:
      - "pages/**"
      - "builders/**"
      - "validators/**"
      - "tests/**"
      - ".github/workflows/ui-tests.yml"
  schedule:
    - cron: "0 2 * * *" # nightly

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run UI tests
        run: |
              export ALLURE_RESULTS_DIR=allure-results/ui
              npx playwright test

      - name: Restore existing API report
        run: |
          git fetch origin gh-pages
          git checkout origin/gh-pages -- api || true  

      - name: Create landing page
        run: |
          cat <<EOF > allure-report/index.html
            <!DOCTYPE html>
              <html>
                <head>
                  <meta charset="UTF-8" />
                  <title>Automation Reports</title>
                </head>
              <body>
                <h1>Automation Test Reports</h1>
              <ul>
                  <li><a href="./ui/">UI Test Report</a></li>
                  <li><a href="./api/">API Test Report</a></li>
              </ul>
              </body>
              </html>
          EOF
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_branch: gh-pages
            publish_dir: allure-report
            force_orphan: true

      - name: Add landing page
        run: |
          cp allure-pages/index.html allure-report/index.html

      - name: Debug Allure results
        run: |
              echo "=== allure-results ==="
              ls -R allure-results || true
              echo "=== allure-report ==="
              ls -R allure-report || true    
